<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>词汇课 · Học Từ Vựng Mỗi Ngày</title>
<style>
:root{
  --paper:#FAF6EC; --paper-deep:#F1EAD8; --ink:#2A2420; --ink-soft:#7A6F62;
  --seal:#B23A2E; --seal-dark:#8F2E25; --seal-tint:#F7E4DF;
  --bamboo:#4C7A5D; --bamboo-tint:#E7F0EA; --bamboo-dark:#375A44;
  --gold:#B8933F; --card:#FFFFFF; --border:#E5DCC7; --border-soft:#EFE8D8;
  --shadow:0 2px 10px rgba(42,36,32,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:78px; min-height:100vh;
}
.hanzi{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--border); padding:14px 16px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .seal{
  width:34px;height:34px;border-radius:50%;background:var(--seal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  font-family:"Songti SC","STSong","SimSun",serif; flex-shrink:0; box-shadow:0 2px 4px rgba(178,58,46,.35);
}
.brand-text{line-height:1.15;}
.brand-text .t1{font-size:15px;font-weight:800;color:var(--ink);}
.brand-text .t2{font-size:11px;color:var(--ink-soft);}
.streak-pill{
  display:flex;align-items:center;gap:5px;background:var(--bamboo-tint);color:var(--bamboo-dark);
  padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:700;
}
.topbar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.session-timer{
  font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--paper-deep);
  padding:6px 10px; border-radius:20px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.hero-total-time{font-size:12.5px; color:var(--ink-soft); margin-top:-8px; margin-bottom:14px;}
/* ---------- Screens ---------- */
.screen{display:none; padding:16px; max-width:640px; margin:0 auto;}
.screen.active{display:block;}

/* ---------- Home ---------- */
.hero-card{
  background:linear-gradient(160deg,#fff,var(--paper-deep));
  border:1px solid var(--border); border-radius:16px; padding:22px 18px;
  text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.hero-card::after{
  content:"学"; position:absolute; right:-10px; bottom:-30px; font-size:130px;
  font-family:"Songti SC","STSong","SimSun",serif; color:rgba(178,58,46,.06); line-height:1; pointer-events:none;
}
.hero-day{font-size:14px; color:var(--ink-soft); font-weight:600; letter-spacing:.5px;}
.hero-count{font-size:40px; font-weight:800; color:var(--ink); margin:6px 0 2px; font-family:Georgia,serif;}
.hero-sub{font-size:14.5px; color:var(--ink-soft); margin-bottom:16px;}
.btn-primary{
  background:var(--seal); color:#fff; border:none; padding:11px 16px; border-radius:10px;
  font-size:14px; font-weight:800; width:100%; cursor:pointer; box-shadow:0 3px 9px rgba(178,58,46,.3);
}
.btn-primary:active{background:var(--seal-dark);}
.btn-primary.done{background:var(--bamboo); box-shadow:0 4px 12px rgba(76,122,93,.25);}
.btn-secondary{
  background:#fff; color:var(--ink); border:1px solid var(--border); padding:10px 14px;
  border-radius:10px; font-size:13px; font-weight:700; width:100%; cursor:pointer;
}
.stats-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;}
.stat-box{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 6px; text-align:center;}
.stat-box .n{font-size:23px; font-weight:800; color:var(--seal); font-family:Georgia,serif;}
.stat-box .l{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.section-label{font-size:14px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin:24px 0 10px;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
  display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1; border:none; background:none; padding:8px 4px 6px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--ink-soft); font-size:10.5px; font-weight:700; cursor:pointer;
}
.nav-btn .ic{font-size:15px;}
.nav-btn.active{color:var(--seal);}

/* ---------- Word list ---------- */
.word-row{
  display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border);
  border-radius:12px; padding:12px 14px; margin-bottom:8px;
}
.word-row .wh{font-size:24px; font-weight:700; min-width:60px;}
.word-row .wp{font-size:16px; color:var(--gold); font-weight:600; min-width:64px;}
.word-row .wv{font-size:16.5px; color:var(--ink-soft); flex:1;}
.word-row.locked{opacity:.4;}
.badge-day{font-size:10px; background:var(--paper-deep); color:var(--ink-soft); padding:3px 7px; border-radius:8px; font-weight:700; flex-shrink:0;}
.search-box{
  width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px; font-size:15px;
  margin-bottom:14px; background:#fff;
}

/* ---------- Lesson flow ---------- */
.lesson-header{display:flex; align-items:center; gap:10px; margin-bottom:10px; position:sticky; top:0; background:var(--paper); z-index:30; padding-top:10px; padding-bottom:4px;}
.lesson-back{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:4px;}
.progress-track{flex:1; height:7px; background:var(--paper-deep); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--seal); border-radius:6px; transition:width .3s;}
.step-label{font-size:12px; color:var(--ink-soft); font-weight:700; text-align:center; margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px;}

/* Che do hoc: an thanh tren/duoi de gon toan bo noi dung trong 1 khung, giam cuon trang */
body.lesson-mode{padding-bottom:0;}
body.lesson-mode .topbar{display:none;}
body.lesson-mode .bottomnav{display:none;}
body.lesson-mode #screen-lesson{padding-top:4px;}

/* Flashcard */
.flashcard-wrap{perspective:1200px; height:280px; margin-bottom:18px;}
.flashcard{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer;}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; background:#fff;
  border:1px solid var(--border); box-shadow:var(--shadow); display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:20px; text-align:center;
}
.fc-front .hanzi{font-size:64px; font-weight:700;}
.fc-front .pos-tag{position:absolute; top:14px; left:16px; font-size:11px; background:var(--paper-deep); color:var(--ink-soft); padding:3px 9px; border-radius:8px; font-weight:700;}
.fc-front .fc-pinyin-front{color:var(--gold); font-weight:700; font-size:17px; margin-top:6px;}
.fc-front .hint{position:absolute; bottom:16px; font-size:11.5px; color:var(--ink-soft);}
.speak-btn{
  background:var(--bamboo-tint); border:1px solid #cfe3d6; color:var(--bamboo-dark);
  width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; margin-top:10px; flex-shrink:0;
}
.speak-btn:active{background:#cfe3d6;}
.speak-btn.sm{width:30px; height:30px; font-size:13px; margin:0;}
.speak-btn.wide{width:auto; border-radius:20px; padding:8px 16px; font-size:13px; font-weight:700; gap:6px;}
.speak-row{display:flex; align-items:center; gap:8px; justify-content:center;}
.fc-back{transform:rotateY(180deg); background:var(--bamboo-tint); border-color:#cfe3d6;}
.fc-back .pinyin{font-size:28px; color:var(--gold); font-weight:700; margin-bottom:10px;}
.fc-back .meaning{font-size:25px; font-weight:800; color:var(--bamboo-dark); margin-bottom:14px;}
.fc-back .example{font-size:13px; color:var(--ink); background:#fff; border-radius:10px; padding:10px 12px; width:100%;}
.fc-back .example .ex-zh{font-weight:700; margin-bottom:3px;}
.fc-back .example .ex-py{color:var(--gold); font-size:12px; margin-bottom:3px;}
.fc-back .example .ex-vi{color:var(--ink-soft); font-size:12px;}
.fc-nav{display:flex; gap:10px;}
.fc-nav button{flex:1;}
.dot-row{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
.dot.on{background:var(--seal);}

/* Matching game */
.match-cols{display:flex; gap:8px;}
.match-col{flex:1; display:flex; flex-direction:column; gap:8px;}
.match-tile{
  background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:10px 6px;
  text-align:center; font-size:13px; cursor:pointer; font-weight:600; min-height:44px;
  display:flex; align-items:center; justify-content:center; word-break:break-word;
}
.match-tile.hanzi{font-size:17px;}
.match-tile.sel{border-color:var(--seal); background:var(--seal-tint); color:var(--seal-dark);}
.match-tile.done{border-color:var(--bamboo); background:var(--bamboo-tint); color:var(--bamboo-dark); opacity:.55; pointer-events:none;}
.match-tile.err{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.match-status{text-align:center; font-size:12.5px; color:var(--ink-soft); margin:12px 0;}

/* Example sentence step */
.example-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow); text-align:center;}
.example-card .word-line{font-size:36px; font-weight:800; margin-bottom:4px;}
.example-card .word-py{color:var(--gold); font-weight:700; font-size:19px; margin-bottom:18px;}
.example-card .sent-zh{font-size:27px; font-weight:600; margin-bottom:8px; line-height:1.5;}
.example-card .sent-py{color:var(--gold); font-size:18px; margin-bottom:12px;}
.example-card .sent-vi{color:var(--ink-soft); font-size:19px; font-style:italic;}
.example-card .loading{color:var(--ink-soft); font-size:13.5px; padding:30px 0;}
.example-card .err-box{color:var(--seal); font-size:13px; padding:14px 0;}

/* Quiz */
.quiz-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 18px; box-shadow:var(--shadow); text-align:center; margin-bottom:16px;}
.quiz-prompt-hanzi{font-size:42px; font-weight:800; margin-bottom:4px;}

/* Pronunciation step */
.pronounce-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 18px; box-shadow:var(--shadow); text-align:center;}
.pr-type{font-size:11.5px; font-weight:800; color:var(--seal); letter-spacing:.6px; margin-bottom:8px;}
.pr-target{font-size:33px; font-weight:800; margin-bottom:2px; line-height:1.4;}
.pr-py{color:var(--gold); font-weight:700; font-size:18.5px; margin-bottom:12px;}
#prResult{min-height:20px; margin:14px 0;}
.pr-heard-label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; margin-bottom:3px;}
.pr-heard{font-size:19px; font-weight:800; color:var(--ink); margin-bottom:8px;}
.pr-score{font-weight:800; font-size:16px;}
.pr-score.ok{color:var(--bamboo-dark);}
.pr-score.bad{color:var(--seal-dark);}
.mic-btn{
  background:var(--seal); color:#fff; border:none; width:100%; padding:16px; border-radius:14px;
  font-size:15px; font-weight:800; cursor:pointer; margin-top:6px; min-height:54px;
}
.mic-btn.listening{background:var(--seal-dark); animation:micpulse 1s infinite;}
@keyframes micpulse{0%,100%{opacity:1;}50%{opacity:.6;}}
.mic-btn:disabled{opacity:.7;}
.dot.pass{background:var(--bamboo);}
.skip-link{display:block; text-align:center; font-size:12px; color:var(--ink-soft); text-decoration:underline; background:none; border:none; margin:14px auto 0; cursor:pointer;}
.manual-pass-link{display:block; text-align:center; font-size:12.5px; color:var(--bamboo-dark); font-weight:700; text-decoration:underline; background:none; border:none; margin:12px auto 0; cursor:pointer;}
.mic-warn{background:#FFF8E1; border:1px solid #FFE082; color:#8D6E00; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:14px; text-align:left;}

/* Challenge (thu thach doc doan dai, khong bat buoc) */
.challenge-card{background:#fff; border:2px dashed var(--gold); border-radius:16px; padding:20px; text-align:center;}
.challenge-badge{display:inline-block; background:#FFF3D6; color:#8D6E00; font-weight:800; font-size:13px; padding:6px 14px; border-radius:20px; margin-bottom:10px;}
.challenge-sub{font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}
.challenge-target{font-size:22px !important; line-height:1.7 !important; text-align:left;}
.challenge-py{font-size:14px !important; text-align:left; line-height:1.6;}
.challenge-vi{font-size:14px; color:var(--ink-soft); font-style:italic; text-align:left; margin-bottom:14px; line-height:1.6;}
.challenge-heard{font-size:16px !important;}

/* Tap viet - the xem truoc (khong the viet truc tiep, chi de mo modal) */
.writing-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center; box-shadow:var(--shadow);}
.writing-word{font-size:24px; font-weight:800;}
.writing-py{color:var(--gold); font-weight:700; font-size:16px;}
.writing-word-vi{color:var(--ink-soft); font-size:14px; margin-bottom:16px;}
.writing-canvas-wrap{position:relative; margin:0 auto; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#FAFAF7;}
.writing-canvas-wrap canvas{position:absolute; top:0; left:0; touch-action:none;}
.writing-preview{position:relative; cursor:pointer; display:inline-block;}
.writing-preview-hint{margin-top:10px; font-size:13px; font-weight:700; color:var(--seal);}
.writing-btn-row{display:flex; gap:10px; margin-top:8px;}
.writing-btn-row button{flex:1;}

/* Modal tap viet toan man hinh - co dinh, khong the cuon nen phia sau */
.writing-modal-overlay{
  display:none; position:fixed; inset:0; z-index:200; background:rgba(30,26,22,.72);
  align-items:center; justify-content:center; padding:24px 20px; touch-action:none; overscroll-behavior:none;
}
.writing-modal-overlay.open{display:flex;}
.writing-modal-box{
  background:#fff; border-radius:18px; padding:16px; width:100%; max-width:620px;
  max-height:94vh; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; align-items:center;
}
.writing-modal-header{display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px;}
.writing-modal-header #writingModalWord{font-size:19px; font-weight:800;}
.writing-modal-close{background:var(--paper-deep); border:none; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--ink-soft); flex-shrink:0;}
.pen-size-row{display:flex; gap:8px; margin-bottom:12px; width:100%;}
.pen-btn{flex:1; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:9px 4px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
.pen-btn.active{background:var(--seal-tint); border-color:var(--seal); color:var(--seal-dark);}
.quiz-prompt-pinyin{color:var(--gold); font-weight:700; font-size:15px; margin-bottom:4px;}
.quiz-prompt-vi{font-size:26px; font-weight:800; color:var(--ink); line-height:1.4;}
.quiz-options{display:flex; flex-direction:column; gap:10px;}
.opt-btn{
  background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:14px 16px;
  font-size:19px; text-align:left; cursor:pointer; font-weight:600; min-height:52px;
}
.opt-btn.hanzi-opt{font-size:26px; text-align:center;}
.opt-btn.correct{border-color:var(--bamboo); background:var(--bamboo-tint); color:var(--bamboo-dark);}
.opt-btn.wrong{border-color:var(--seal); background:var(--seal-tint); color:var(--seal-dark);}
.opt-btn:disabled{cursor:default;}
.feedback-line{text-align:center; font-size:13.5px; font-weight:700; margin-top:12px; min-height:18px;}
.feedback-line.ok{color:var(--bamboo-dark);}
.feedback-line.bad{color:var(--seal-dark);}

/* Summary */
.summary-card{text-align:center; padding:10px 0 20px;}
.summary-emoji{font-size:56px; margin-bottom:8px;}
.summary-score{font-size:34px; font-weight:800; font-family:Georgia,serif; margin-bottom:4px;}
.summary-sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:22px;}
.summary-list{text-align:left; background:#fff; border:1px solid var(--border); border-radius:12px; padding:6px 14px; margin-bottom:20px;}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:17.5px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .sh{font-weight:700; font-size:21px;}
.summary-row .sv{color:var(--ink-soft); font-size:16px;}

/* Review tab */
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state .em{font-size:44px; margin-bottom:10px;}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
.chip{flex-shrink:0; background:#fff; border:1px solid var(--border); border-radius:20px; padding:9px 15px; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
.chip.active{background:var(--seal); color:#fff; border-color:var(--seal);}

/* Topic cards */
.topic-card{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
.topic-card:active{background:var(--paper-deep);}
.topic-main{flex:1; min-width:0;}
.topic-name{font-weight:700; font-size:16px;}
.topic-check{color:var(--bamboo); font-weight:800;}
.topic-progress{font-size:13px; color:var(--ink-soft); margin-top:3px;}
.topic-bar{height:5px; background:var(--paper-deep); border-radius:4px; margin-top:6px; overflow:hidden;}
.topic-bar-fill{height:100%; background:var(--bamboo); border-radius:4px;}
.topic-arrow{font-size:22px; color:var(--border); flex-shrink:0;}

/* Mastered indicator */
.mastered-check{color:var(--bamboo); font-weight:800; font-size:16px; flex-shrink:0;}
.mastered-tag{background:var(--bamboo-tint) !important; color:var(--bamboo-dark) !important;}

/* Flashcard illustration icon */
.fc-icon{font-size:40px; margin-bottom:2px; line-height:1;}

/* Lesson topic label */
.lesson-topic-label{text-align:center; font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}

/* Badge shelf */
.badge-shelf{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px;}
.voice-diag-box{margin-top:10px; font-size:12.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 12px; line-height:1.5; min-height:0;}
.voice-diag-box:empty{display:none;}
.badge-item{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 6px; text-align:center;}
.badge-item.locked{opacity:.45;}
.badge-icon{font-size:24px; margin-bottom:4px;}
.badge-name{font-size:11.5px; color:var(--ink-soft); font-weight:600; line-height:1.3;}

/* New badge unlock box in summary */
.new-badge-box{background:#FFF8E1; border:1px solid #FFE082; border-radius:12px; padding:12px 14px; margin-bottom:16px; text-align:left;}
.new-badge-title{font-weight:800; font-size:13px; color:#8D6E00; margin-bottom:6px;}
.new-badge-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0;}
.nb-icon{font-size:18px;}
.nb-name{font-weight:600; color:#6b5a1f;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="seal hanzi">学</div>
    <div class="brand-text">
      <div class="t1">词汇课</div>
      <div class="t2">Học từ vựng mỗi ngày</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="session-timer" id="sessionTimerTop">⏱ 0:00</div>
    <div class="streak-pill">🔥 <span id="streakNum">0</span> ngày</div>
  </div>
</div>

<!-- ============ HOME ============ -->
<div class="screen active" id="screen-home">
  <div class="hero-card">
    <div class="hero-day">TỔNG QUAN TIẾN ĐỘ</div>
    <div class="hero-count" id="homeWordsLearned">0 / 447</div>
    <div class="hero-sub">từ đã thuộc</div>
    <div class="hero-total-time" id="homeTotalTime"></div>
  </div>

  <div class="stats-grid">
    <div class="stat-box"><div class="n" id="statStreak">0</div><div class="l">Ngày liên tiếp</div></div>

    badges: [],              // id huy hieu da dat duoc
    totalStudySeconds: 0     // tong thoi gian hoc luy ke (giay), cong don qua cac phien
  };
}

let STATE = defaultState();

async function loadState(){
  // Uu tien window.storage (chi co trong khung xem cua Claude); neu khong co
  // hoac loi, tu dong chuyen sang localStorage cua trinh duyet (khi mo file
  // truc tiep bang Chrome/Safari) de tien do van duoc luu lai binh thuong.
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STATE_KEY, false);
      if(res && res.value){
        STATE = Object.assign(defaultState(), JSON.parse(res.value));
        return;
      }
    }
  }catch(e){ /* roi xuong thu localStorage ben duoi */ }
  try{
    const raw = window.localStorage ? window.localStorage.getItem(STATE_KEY) : null;
    if(raw){ STATE = Object.assign(defaultState(), JSON.parse(raw)); }
  }catch(e){ STATE = defaultState(); }
}

async function saveState(){
  const json = JSON.stringify(STATE);
  let savedViaClaudeStorage = false;
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      const res = await window.storage.set(STATE_KEY, json, false);
      if(res) savedViaClaudeStorage = true;
    }
  }catch(e){ /* roi xuong thu localStorage ben duoi */ }
  if(!savedViaClaudeStorage){
    try{
      if(window.localStorage) window.localStorage.setItem(STATE_KEY, json);
    }catch(e){ console.error('Khong the luu tien do', e); }
  }
}

function getWordsForTopic(topicCode){
  const list = [];
  for(let i = 0; i < WORDS.length; i++){ if(WORDS[i].c === topicCode) list.push(i); }
  return list;
}

function getBatches(topicCode, batchSize){
  const size = batchSize || 5;
  const idxs = getWordsForTopic(topicCode);
  const batches = [];
  for(let i = 0; i < idxs.length; i += size){ batches.push(idxs.slice(i, i + size)); }
  return batches;
}

function getMasteredSet(){
  return new Set(STATE.masteredWords);
}

function markWordsMastered(indices){
  const set = getMasteredSet();
  indices.forEach(i => set.add(i));
  STATE.masteredWords = Array.from(set);
}

function checkAndAwardBadges(){
  const newlyEarned = [];
  BADGES.forEach(b => {
    if(!STATE.badges.includes(b.id) && b.test(STATE)){
      STATE.badges.push(b.id);
      newlyEarned.push(b);
    }
  });
  return newlyEarned;
}

function recordStudyToday(){
  const t = todayStr();
  if(STATE.lastStudyDate !== t){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    STATE.streak = (STATE.lastStudyDate === yStr) ? STATE.streak + 1 : 1;
    STATE.lastStudyDate = t;
  }
}

function finishBatchStats(masteredIdx, quizCorrect, quizTotal, isPerfect){
  markWordsMastered(masteredIdx);
  STATE.quizStats.correct += quizCorrect;
  STATE.quizStats.total += quizTotal;
  if(isPerfect) STATE.perfectCount += 1;
  recordStudyToday();
}

function markTopicCompleted(topicCode){
  if(!STATE.topicsCompleted.includes(topicCode)) STATE.topicsCompleted.push(topicCode);
}

function pickRandomDistractors(correctIdx, count, pool){
  const source = pool || WORDS.map((_, i) => i);
  const options = new Set();
  let guard = 0;
  while(options.size < count && guard < 500){
    guard++;
    const r = source[Math.floor(Math.random() * source.length)];
    if(r !== correctIdx) options.add(r);
  }
  return Array.from(options);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let sessionSeconds = 0;

function formatClock(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if(h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatDuration(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if(h > 0) return `${h} giờ ${m} phút`;
  if(m > 0) return `${m} phút ${s} giây`;
  return `${s} giây`;
}

function tickSessionTimer(){
  sessionSeconds++;
  const clockStr = '⏱ ' + formatClock(sessionSeconds);
  const topEl = document.getElementById('sessionTimerTop');
  if(topEl) topEl.textContent = clockStr;
  const lessonEl = document.getElementById('sessionTimerLesson');
  if(lessonEl) lessonEl.textContent = clockStr;

  if(sessionSeconds % 30 === 0){
    STATE.totalStudySeconds = (STATE.totalStudySeconds || 0) + 30;
    saveState();
    const totalEl = document.getElementById('homeTotalTime');
    if(totalEl) totalEl.textContent = '⏱️ Tổng thời gian đã học: ' + formatDuration(STATE.totalStudySeconds);
  }
}

function speak(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    const synth = window.speechSynthesis;
    // Chi huy nhung cau dang doc do (khong huy khi khong co gi dang phat), va KHONG
    // dung setTimeout truoc speak() - Safari/iOS yeu cau goi speak() dong bo ngay
    // trong thao tac cham cua nguoi dung, tri hoan se bi trinh duyet chan im lang.
    if(synth.speaking || synth.pending){ synth.cancel(); }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    const zhVoice = findChineseVoice();
    if(zhVoice) u.voice = zhVoice;
    synth.speak(u);
  }catch(e){ /* trinh duyet khong ho tro phat am, bo qua */ }
}

function runVoiceDiagnostic(){
  const box = document.getElementById('voiceDiagResult');
  if(!box) return;

    box.innerHTML = '❌ Trình duyệt này không hỗ trợ đọc giọng nói (Speech Synthesis).';
    return;

  const zhVoice = findChineseVoice();

  if(zhVoice){
    box.innerHTML = `✅ Tìm thấy giọng tiếng Trung: <b>${zhVoice.name}</b> (${zhVoice.lang}). Nếu vẫn không nghe thấy, hãy kiểm tra âm lượng chuông/media của thiết bị.`;
  } else if(allCount > 0){

  } else {
    box.innerHTML = '⚠️ Chưa tải được danh sách giọng đọc (thường xảy ra khi mới mở trang). Hãy bấm nút này lại sau vài giây, hoặc thử phát 1 từ bất kỳ trước.';

}

let LESSON = null;

function startTopicLesson(topicCode){
  const batches = getBatches(topicCode);
  if(batches.length === 0) return;
  LESSON = { topicCode, batches, batchIndex: 0 };
  micPermissionChecked = false;
  switchScreen('lesson');
  initBatch(0);
}

function initBatch(batchIndex){
  LESSON.batchIndex = batchIndex;
  const newWords = LESSON.batches[batchIndex];
  const priorWords = [];
  for(let b = 0; b < batchIndex; b++){ priorWords.push(...LESSON.batches[b]); }
  const reviewWords = shuffle(priorWords).slice(0, 10);

  const steps = [];
  if(reviewWords.length > 0) steps.push('review');
  steps.push('flashcards', 'writing', 'matching', 'examples', 'pronounce');

  const pronounceTasks = buildPronounceTasks(newWords);
  const challengeTask = buildChallengeTask(newWords);
  if(challengeTask) steps.push('pronounce-challenge');
  steps.push('quiz-zh-vi', 'quiz-vi-zh', 'summary');

  const writingTasks = buildWritingTasks(newWords);

  Object.assign(LESSON, {
    newWords, reviewWords, steps, stepIndex: 0,
    cardPos: 0,
    quizIndex: 0,
    quizZhVi: buildQuizSet(newWords, 'zh'),
    quizViZh: buildQuizSet(newWords, 'vi'),
    quizCorrectCount: 0,
    exPos: 0,
    pronounceTasks, pronouncePos: 0,
    pronouncePassed: new Array(pronounceTasks.length).fill(false),
    challengeTask,
    writingTasks, writingPos: 0,
    writingPassed: new Array(writingTasks.length).fill(false)
  });
  micPermissionChecked = false;
  renderLessonStep();
}

function extractHanziChars(str){
  const m = str.match(/[\u4e00-\u9fff]/g);
  return (m && m.length) ? m : [str];
}

function buildWritingTasks(newWords){
  return newWords.map(idx => ({ wordIdx: idx, chars: extractHanziChars(WORDS[idx].h) }));
}

function buildPronounceTasks(newWords){
  const tasks = [];
  newWords.forEach(idx => {
    const w = WORDS[idx];
    // Chi dung cau vi du day du (co ngu canh) de luyen phat am - nhan dien giong noi
    // tren trinh duyet chinh xac hon rat nhieu voi ca cau so voi tung chu don le
    // (vi du: "把" bǎ va "爸" bà phat am gan giong het nhau khi doc rieng le).
    if(w.ez){
      tasks.push({ wordIdx: idx, type: 'sentence', target: w.ez, py: w.ep });
    } else {
      tasks.push({ wordIdx: idx, type: 'word', target: w.h, py: w.p });
    }
  });
  return tasks;
}

function buildChallengeTask(newWords){
  // Ghep 3-5 cau vi du (da co san) cua cac tu moi trong nhom thanh 1 doan van dai
  // de luyen doc lien mach - day la phan THU THACH, khong bat buoc dat diem.
  const withEx = newWords.filter(i => WORDS[i].ez);
  if(withEx.length < 3) return null;
  const count = Math.min(withEx.length, 5);
  const chosen = withEx.slice(0, count);
  const zh = chosen.map(i => WORDS[i].ez).join('');
  const py = chosen.map(i => WORDS[i].ep).join(' ');
  const vi = chosen.map((i, idx) => (idx + 1) + '. ' + WORDS[i].ev).join('  ');
  return { target: zh, py, vi, count };
}

function buildQuizSet(wordIdxs, mode){
  return shuffle(wordIdxs).map(idx => {
    const distractors = pickRandomDistractors(idx, 3, WORDS.map((_,i)=>i));
    const optionIdxs = shuffle([idx, ...distractors]);
    return { wordIdx: idx, optionIdxs, mode, answered: false, correct: null };
  });
}

function exitLesson(){
  document.getElementById('screen-lesson').classList.remove('active');
  switchScreen('home');
}

function updateLessonChrome(){
  const stepsInBatch = LESSON.steps.length;
  const totalBatches = LESSON.batches.length;
  const overallPct = Math.round(100 * (LESSON.batchIndex + LESSON.stepIndex / stepsInBatch) / totalBatches);
  document.getElementById('lessonProgressFill').style.width = overallPct + '%';
  const topicLabel = document.getElementById('lessonTopicLabel');
  if(topicLabel){
    topicLabel.textContent = `${TOPIC_ICONS[LESSON.topicCode]} ${TOPIC_NAMES[LESSON.topicCode]} · Nhóm ${LESSON.batchIndex + 1}/${totalBatches}`;
  }
  const labels = {
    'review':'Ôn tập từ cũ', 'flashcards':'Từ mới', 'matching':'Nối từ',
    'examples':'Ví dụ ngữ cảnh', 'pronounce':'Luyện phát âm',
    'pronounce-challenge':'🏆 Thử thách đọc đoạn dài',
    'writing':'✍️ Tập viết',
    'quiz-zh-vi':'Trắc nghiệm: Hán → Việt',
    'quiz-vi-zh':'Trắc nghiệm: Việt → Hán', 'summary':'Hoàn thành'
  };
  document.getElementById('lessonStepLabel').textContent = labels[LESSON.steps[LESSON.stepIndex]] || '';
}

function nextLessonStep(){
  LESSON.stepIndex++;
  LESSON.cardPos = 0; LESSON.quizIndex = 0; LESSON.exPos = 0; LESSON.pronouncePos = 0; LESSON.writingPos = 0;
  if(LESSON.stepIndex >= LESSON.steps.length){ exitLesson(); return; }
  renderLessonStep();
}

function renderLessonStep(){
  updateLessonChrome();
  const step = LESSON.steps[LESSON.stepIndex];
  const body = document.getElementById('lessonBody');
  if(step === 'review') return renderStepReview(body);
  if(step === 'flashcards') return renderStepFlashcards(body);
  if(step === 'writing') return renderStepWriting(body);
  if(step === 'matching') return renderStepMatching(body);
  if(step === 'examples') return renderStepExamples(body);
  if(step === 'pronounce') return renderStepPronounce(body);
  if(step === 'pronounce-challenge') return renderStepChallenge(body);
  if(step === 'quiz-zh-vi') return renderStepQuiz(body, 'zh-vi');
  if(step === 'quiz-vi-zh') return renderStepQuiz(body, 'vi-zh');
  if(step === 'summary') return renderStepSummary(body);
}

/* ---------- STEP: tap viet (modal toan man hinh, co dinh khong cuon) ---------- */
function drawCharsToCanvas(ctx, chars, cell, color, drawGrid){
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.font = `${Math.floor(cell * 0.72)}px "Songti SC","STSong","SimSun","Noto Serif SC",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  chars.forEach((ch, i) => {
    if(drawGrid){
      ctx.save();
      ctx.strokeStyle = 'rgba(42,36,32,0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(i * cell + 2, 2, cell - 4, cell - 4);
      ctx.beginPath();
      ctx.moveTo(i * cell + cell / 2, 2); ctx.lineTo(i * cell + cell / 2, cell - 2);
      ctx.moveTo(i * cell + 2, cell / 2); ctx.lineTo(i * cell + cell - 2, cell / 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillText(ch, i * cell + cell / 2, cell / 2 + 1);
  });
}

let modalDrawing = false, modalLastPos = null, modalInkCtx = null;
let currentPenFactor = 0.025;

function setupInkCanvas(canvas, h){
  const ctx = canvas.getContext('2d');
  modalInkCtx = ctx;
  ctx.lineWidth = Math.max(3, Math.floor(h * currentPenFactor));
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2A2420';

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
  };
  canvas.onpointerdown = (e) => {
    e.preventDefault();
    modalDrawing = true;
    modalLastPos = getPos(e);
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  };
  canvas.onpointermove = (e) => {
    if(!modalDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(modalLastPos.x, modalLastPos.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    modalLastPos = pos;
  };
  const endDraw = (e) => { if(e) e.preventDefault(); modalDrawing = false; };
  canvas.onpointerup = endDraw;
  canvas.onpointerleave = endDraw;
  canvas.onpointercancel = endDraw;
}

function computeShapeScore(chars, cell, inkCanvas){
  const w = inkCanvas.width, h = inkCanvas.height;
  const userData = inkCanvas.getContext('2d').getImageData(0, 0, w, h).data;

  const refCanvas = document.createElement('canvas');
  refCanvas.width = w; refCanvas.height = h;
  const refCtx = refCanvas.getContext('2d');
  drawCharsToCanvas(refCtx, chars, cell, '#000000', false);
  const refData = refCtx.getImageData(0, 0, w, h).data;

  let refInk = 0, userInk = 0, overlap = 0, extra = 0;
  for(let i = 0; i < refData.length; i += 4){
    const isRef = refData[i + 3] > 50;
    const isUser = userData[i + 3] > 50;
    if(isRef) refInk++;
    if(isUser) userInk++;
    if(isRef && isUser) overlap++;
    if(isUser && !isRef) extra++;
  }
  const recall = refInk > 0 ? overlap / refInk : 0;
  const extraRatio = userInk > 0 ? extra / userInk : 0;
  let score = Math.round(Math.max(0, Math.min(1, recall - extraRatio * 0.5)) * 100);
  if(userInk < 20) score = 0; // chua ve gi dang ke
  return score;
}

/* ---------- STEP: matching game (3 columns) ---------- */
let MATCH = null;
function renderStepMatching(body){
  const words = LESSON.newWords.map(i => WORDS[i]);
  MATCH = {
    hanziCol: shuffle(words.map((w,i)=>({wordIdx:i, text:w.h}))),
    pinyinCol: shuffle(words.map((w,i)=>({wordIdx:i, text:w.p}))),
    vietCol: shuffle(words.map((w,i)=>({wordIdx:i, text:w.v}))),
    selHanzi: null, selPinyin: null,
    solved: new Set()
  };
  drawMatching(body, words);
}

function drawMatching(body, words){
  const col = (items, cls) => items.map(it => {
    const solved = MATCH.solved.has(it.wordIdx);
    return `<div class="match-tile ${cls} ${solved?'done':''}" data-idx="${it.wordIdx}">${it.text}</div>`;
  }).join('');
  body.innerHTML = `
    <div class="match-status">Chạm lần lượt: Chữ Hán → Pinyin → Nghĩa Tiếng Việt tương ứng</div>
    <div class="match-cols">
      <div class="match-col" data-col="hanzi">${col(MATCH.hanziCol, 'hanzi')}</div>
      <div class="match-col" data-col="pinyin">${col(MATCH.pinyinCol, '')}</div>
      <div class="match-col" data-col="viet">${col(MATCH.vietCol, '')}</div>
    </div>
    <div id="matchDoneWrap" style="margin-top:20px;"></div>`;
  body.querySelectorAll('.match-tile').forEach(tile => {
    tile.addEventListener('click', () => onMatchTileClick(tile, body, words));
  });
  if(MATCH.solved.size === words.length){
    document.getElementById('matchDoneWrap').innerHTML = '<button class="btn-primary" id="matchContinue">Tiếp: Ví dụ ngữ cảnh →</button>';
    document.getElementById('matchContinue').addEventListener('click', nextLessonStep);
  }
}

function onMatchTileClick(tile, body, words){
  if(tile.classList.contains('done')) return;
  const colName = tile.parentElement.dataset.col;
  const idx = parseInt(tile.dataset.idx, 10);

  if(colName === 'hanzi'){
    MATCH.selHanzi = idx; MATCH.selPinyin = null;
    speak(words[idx].h);
    highlightSelections(body);
    return;
  }
  if(colName === 'pinyin'){
    if(MATCH.selHanzi === null) return;
    if(idx === MATCH.selHanzi){
      MATCH.selPinyin = idx;
      highlightSelections(body);
    } else {
      flashError(body, [tile, findTile(body,'hanzi',MATCH.selHanzi)]);
      MATCH.selHanzi = null; MATCH.selPinyin = null;
    }
    return;
  }
  if(colName === 'viet'){
    if(MATCH.selHanzi === null || MATCH.selPinyin === null) return;
    if(idx === MATCH.selHanzi){
      MATCH.solved.add(idx);
      MATCH.selHanzi = null; MATCH.selPinyin = null;
      drawMatching(body, words);
    } else {
      flashError(body, [tile]);
      MATCH.selHanzi = null; MATCH.selPinyin = null;
      highlightSelections(body);
    }
  }
}

function findTile(body, col, idx){
  return body.querySelector(`.match-col[data-col="${col}"] .match-tile[data-idx="${idx}"]`);
}

function highlightSelections(body){
  body.querySelectorAll('.match-tile').forEach(t => t.classList.remove('sel'));
  if(MATCH.selHanzi !== null){
    const t = findTile(body, 'hanzi', MATCH.selHanzi); if(t) t.classList.add('sel');
  }
  if(MATCH.selPinyin !== null){
    const t = findTile(body, 'pinyin', MATCH.selPinyin); if(t) t.classList.add('sel');
  }
}

function flashError(body, tiles){
  tiles.forEach(t => { if(t){ t.classList.add('err'); setTimeout(()=>t.classList.remove('err'), 350); } });
  setTimeout(() => { body.querySelectorAll('.match-tile').forEach(t => t.classList.remove('sel')); }, 300);
}

/* ---------- STEP: luyen phat am (Web Speech API) ---------- */
let micPermissionChecked = false;

async function ensureMicPermission(){
  if(micPermissionChecked) return;
  micPermissionChecked = true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  }catch(e){
    const banner = document.getElementById('micWarnBanner');
    if(banner) banner.style.display = 'block';
  }
}

function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = 0; i <= m; i++) dp[i][0] = i;
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = (a[i-1] === b[j-1]) ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function cleanZhText(s){
  return (s || '').replace(/[，。！？、,.!?\s“”"'『』（）()]/g, '');
}

function computeReadingScore(target, recognized){
  const t = cleanZhText(target);
  const r = cleanZhText(recognized);
  if(!r) return 0;
  // Diem 1: do tuong dong tong the (thu tu + do dai), phat hien doc dung mach cau
  const dist = levenshtein(t, r);
  const maxLen = Math.max(t.length, r.length, 1);
  const editScore = Math.max(0, (1 - dist / maxLen) * 100);
  // Diem 2: ty le ky tu dung xuat hien (khong quan tam thu tu), khoan dung hon
  // voi loi nhan dien tach tu/ghep chu cua trinh duyet
  let matchCount = 0;
  const rChars = r.split('');
  t.split('').forEach(ch => {
    const idx = rChars.indexOf(ch);
    if(idx !== -1){ matchCount++; rChars.splice(idx, 1); }
  });
  const overlapScore = t.length > 0 ? (matchCount / t.length) * 100 : 0;
  return Math.round(Math.max(editScore, overlapScore));
}

function startPronounceAttempt(task, body){
  const SR = getSpeechRecognitionCtor();
  const micBtn = document.getElementById('micBtn');
  const resultEl = document.getElementById('prResult');
  const nextBtn = document.getElementById('prNext');
  const posAtStart = LESSON.pronouncePos;
  let recognition;
  try{

    resultEl.innerHTML = '<div class="pr-score bad">Không thể khởi động micro trên trình duyệt này.</div>';
    return;

  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micBtn.textContent = '🎙️ Đang nghe...';
  micBtn.classList.add('listening');
  micBtn.disabled = true;
  resultEl.innerHTML = '';

  recognition.onresult = (event) => {
    if(LESSON.pronouncePos !== posAtStart) return; // nguoi dung da chuyen the trong luc cho
    const transcript = (event.results[0][0].transcript || '').trim();
    if(!transcript){
      resultEl.innerHTML = `<div class="pr-score bad">Không nhận diện được giọng nói nào cả — hãy thử nói to và rõ hơn, sát micro hơn.</div>`;
      return;
    }
    const score = computeReadingScore(task.target, transcript);
    const pass = score >= 80;
    if(pass) LESSON.pronouncePassed[posAtStart] = true;
    resultEl.innerHTML = `
      <div class="pr-heard-label">App nghe thấy bạn đọc:</div>
      <div class="pr-heard">"${transcript}"</div>
      <div class="pr-score ${pass ? 'ok' : 'bad'}">${score}%${pass ? ' ✓ Đạt yêu cầu' : ' — Chưa đạt (cần ≥ 80%), hãy thử lại'}</div>`;
    if(pass && nextBtn) nextBtn.removeAttribute('disabled');
  };
  recognition.onerror = (event) => {
    if(LESSON.pronouncePos !== posAtStart) return;
    let msg = 'Có lỗi khi ghi âm, hãy thử lại.';
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      msg = 'Micro đang bị chặn. Hãy vào Cài đặt trình duyệt (Safari/Chrome) → Quyền cho trang web này → bật Micro, rồi tải lại trang. Nếu bạn đang mở file trong khung xem trước của một ứng dụng khác (Zalo, Messenger...), hãy mở file này bằng trình duyệt Safari/Chrome thay vì xem trước trong ứng dụng đó.';
    } else if(event.error === 'no-speech'){
      msg = 'Không nghe thấy giọng nói, hãy thử lại và nói to, rõ hơn.';
    } else if(event.error === 'audio-capture'){
      msg = 'Không tìm thấy micro trên thiết bị này.';
    } else if(event.error === 'network'){
      msg = 'Tính năng nhận diện giọng nói cần kết nối mạng. Hãy kiểm tra lại mạng và thử lại.';
    }
    resultEl.innerHTML = `<div class="pr-score bad">${msg}</div>`;
    // Reset ngay tai day, khong cho vao onend vi mot so trinh duyet khong bao gio goi onend sau loi quyen truy cap
    micBtn.textContent = '🎤 Chạm để đọc';
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  };
  recognition.onend = () => {
    if(LESSON.pronouncePos !== posAtStart) return;
    if(micBtn.textContent === '🎙️ Đang nghe...'){
      micBtn.textContent = '🎤 Đọc lại';
    }
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  };
  try{
    recognition.start();
  }catch(e){
    resultEl.innerHTML = '<div class="pr-score bad">Không thể khởi động micro.</div>';
    micBtn.textContent = '🎤 Chạm để đọc';
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  }
}

/* ---------- STEP: thu thach doc doan dai (khong bat buoc) ---------- */
function renderStepChallenge(body){
  const task = LESSON.challengeTask;
  const SR = getSpeechRecognitionCtor();
  body.innerHTML = `
    <div class="challenge-card">
      <div class="challenge-badge">🏆 THỬ THÁCH: ĐỌC ĐOẠN DÀI</div>
      <div class="challenge-sub">Đọc liền mạch ${task.count} câu chứa các từ vừa học. Đạt từ 70% là tuyệt vời — không đạt cũng không sao, bạn vẫn tiếp tục bình thường!</div>
      <div class="pr-target hanzi challenge-target">${task.target}</div>
      <div class="pr-py challenge-py">${task.py}</div>
      <div class="challenge-vi">${task.vi}</div>
      <button class="speak-btn sm" data-speak="${task.target}">🔊 Nghe mẫu</button>
      <div id="chResult"></div>
      ${SR ? '<button class="mic-btn" id="chMicBtn">🎤 Chạm để đọc thử thách</button>' : '<div class="mic-warn">Trình duyệt này chưa hỗ trợ nhận diện giọng nói — bỏ qua phần thử thách nhé.</div>'}
    </div>
    <button class="btn-primary" id="chNextBtn" style="margin-top:16px;">Sang bước Trắc nghiệm →</button>`;

  if(SR) document.getElementById('chMicBtn').addEventListener('click', () => startChallengeAttempt(task, body));
  document.getElementById('chNextBtn').addEventListener('click', nextLessonStep);
}

function startChallengeAttempt(task, body){
  const SR = getSpeechRecognitionCtor();
  const micBtn = document.getElementById('chMicBtn');
  const resultEl = document.getElementById('chResult');
  let recognition;
  try{
    recognition = new SR();
  }catch(e){
    resultEl.innerHTML = '<div class="pr-score bad">Không thể khởi động micro trên trình duyệt này.</div>';
    return;
  }
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micBtn.textContent = '🎙️ Đang nghe...';
  micBtn.classList.add('listening');
  micBtn.disabled = true;
  resultEl.innerHTML = '';

  recognition.onresult = (event) => {
    const transcript = (event.results[0][0].transcript || '').trim();
    if(!transcript){
      resultEl.innerHTML = `<div class="pr-score bad">Không nhận diện được giọng nói nào — hãy thử nói to, rõ hơn.</div>`;
      return;
    }
    const score = computeReadingScore(task.target, transcript);
    const pass = score >= 70;
    resultEl.innerHTML = `
      <div class="pr-heard-label">App nghe thấy bạn đọc:</div>
      <div class="pr-heard challenge-heard">"${transcript}"</div>
      <div class="pr-score ${pass ? 'ok' : 'bad'}">${score}%${pass ? ' 🎉 Xuất sắc!' : ' — Chưa tới 70%, không sao cả, cứ tiếp tục nhé!'}</div>`;
  };
  recognition.onerror = (event) => {
    let msg = 'Có lỗi khi ghi âm, hãy thử lại.';
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      msg = 'Micro đang bị chặn. Bạn có thể bỏ qua phần thử thách này và tiếp tục bình thường.';
    } else if(event.error === 'no-speech'){
      msg = 'Không nghe thấy giọng nói, hãy thử lại.';
    }
    resultEl.innerHTML = `<div class="pr-score bad">${msg}</div>`;
    micBtn.textContent = '🎤 Chạm để đọc thử thách';
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  };
  recognition.onend = () => {
    if(micBtn.textContent === '🎙️ Đang nghe...'){
      micBtn.textContent = '🎤 Đọc lại';
    }
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  };
  try{
    recognition.start();
  }catch(e){
    resultEl.innerHTML = '<div class="pr-score bad">Không thể khởi động micro.</div>';
    micBtn.textContent = '🎤 Chạm để đọc thử thách';
    micBtn.classList.remove('listening');
    micBtn.disabled = false;
  }
}

/* ---------- STEP: quiz (2 chieu) ---------- */
function renderStepQuiz(body, direction){
  const set = direction === 'zh-vi' ? LESSON.quizZhVi : LESSON.quizViZh;
  const q = set[LESSON.quizIndex];
  const isLast = LESSON.quizIndex === set.length - 1;
  const w = WORDS[q.wordIdx];

  let promptHtml, optionsHtml;
  if(direction === 'zh-vi'){
    promptHtml = `<div class="quiz-prompt-hanzi hanzi">${w.h}</div><div class="quiz-prompt-pinyin">${w.p}</div><button class="speak-btn sm" data-speak="${w.h}">🔊</button>`;
    optionsHtml = q.optionIdxs.map(oi => `<button class="opt-btn" data-oi="${oi}">${WORDS[oi].v}</button>`).join('');
  } else {
    promptHtml = `<div class="quiz-prompt-vi">${w.v}</div>`;
    optionsHtml = q.optionIdxs.map(oi => `<button class="opt-btn hanzi-opt hanzi" data-oi="${oi}">${WORDS[oi].h}<br><span style="font-size:15.5px;color:var(--gold);">${WORDS[oi].p}</span></button>`).join('');
  }

  body.innerHTML = `
    <div class="quiz-card">
      <div style="font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:10px;">CÂU ${LESSON.quizIndex+1}/${set.length}</div>
      ${promptHtml}
    </div>
    <div class="quiz-options" id="quizOptions">${optionsHtml}</div>
    <div class="feedback-line" id="quizFeedback"></div>
    <button class="btn-primary" id="quizNextBtn" style="margin-top:16px;display:none;">${isLast ? 'Xem kết quả →' : 'Câu tiếp theo →'}</button>`;

  document.getElementById('quizOptions').querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(q.answered) return;
      q.answered = true;
      const chosenIdx = parseInt(btn.dataset.oi, 10);
      const isCorrect = chosenIdx === q.wordIdx;
      q.correct = isCorrect;
      if(isCorrect) LESSON.quizCorrectCount++;
      document.querySelectorAll('#quizOptions .opt-btn').forEach(b => {
        b.disabled = true;
        const oi = parseInt(b.dataset.oi, 10);
        if(oi === q.wordIdx) b.classList.add('correct');
        else if(oi === chosenIdx) b.classList.add('wrong');
      });
      const fb = document.getElementById('quizFeedback');
      fb.textContent = isCorrect ? ('✓ ' + randomPraise()) : '✗ Chưa đúng, đáp án đúng đã được tô xanh.';
      fb.className = 'feedback-line ' + (isCorrect ? 'ok' : 'bad');
      document.getElementById('quizNextBtn').style.display = 'block';
    });
  });

  document.getElementById('quizNextBtn').addEventListener('click', () => {
    if(isLast){
      if(direction === 'zh-vi'){ nextLessonStep(); }
      else { nextLessonStep(); }
    } else {
      LESSON.quizIndex++;
      renderLessonStep();
    }
  });
}

/* ---------- STEP: summary ---------- */
function renderStepSummary(body){
  const totalQ = LESSON.quizZhVi.length + LESSON.quizViZh.length;
  const pct = totalQ > 0 ? Math.round(100 * LESSON.quizCorrectCount / totalQ) : 100;
  const isPerfect = totalQ > 0 && LESSON.quizCorrectCount === totalQ;
  const isLastBatch = LESSON.batchIndex === LESSON.batches.length - 1;

  const masteredThisBatch = LESSON.newWords.filter(idx => {
    const zhQ = LESSON.quizZhVi.find(q => q.wordIdx === idx);
    const viQ = LESSON.quizViZh.find(q => q.wordIdx === idx);
    return (zhQ && zhQ.correct) || (viQ && viQ.correct);
  });
  finishBatchStats(masteredThisBatch, LESSON.quizCorrectCount, totalQ, isPerfect);
  if(isLastBatch) markTopicCompleted(LESSON.topicCode);
  const newBadges = checkAndAwardBadges();
  saveState();

  let emoji, praiseTitle;
  if(pct === 100){ emoji = '🌟'; praiseTitle = 'HOÀN HẢO! Bạn thật xuất sắc!'; }
  else if(pct >= 80){ emoji = '🎉'; praiseTitle = 'Rất tốt! Tiếp tục phát huy nhé!'; }
  else if(pct >= 50){ emoji = '👍'; praiseTitle = 'Khá ổn, cố gắng thêm nhé!'; }
  else { emoji = '💪'; praiseTitle = 'Đừng nản, ôn lại rồi thử lại nhé!'; }

  const badgeHtml = newBadges.length > 0 ? `
    <div class="new-badge-box">
      <div class="new-badge-title">🎁 Mở khóa huy hiệu mới!</div>
      ${newBadges.map(b => `<div class="new-badge-row"><span class="nb-icon">${b.icon}</span><span class="nb-name">${b.name}</span></div>`).join('')}
    </div>` : '';

  const nextBtnHtml = isLastBatch
    ? `<button class="btn-primary" id="summaryDone">🎉 Hoàn tất chủ đề — Về trang chủ</button>`
    : `<button class="btn-primary" id="summaryDone">Học tiếp nhóm từ ${LESSON.batchIndex + 2}/${LESSON.batches.length} →</button>`;

  body.innerHTML = `
    <div class="summary-card">
      <div class="summary-emoji">${emoji}</div>
      <div class="summary-score">${LESSON.quizCorrectCount}/${totalQ}</div>
      <div class="summary-sub">${praiseTitle} (đúng ${pct}%)</div>
      ${badgeHtml}
      <div class="summary-list">
        ${LESSON.newWords.map(i => `<div class="summary-row"><span class="sh hanzi">${WORDS[i].h}</span><span class="sv">${WORDS[i].p} — ${WORDS[i].v}</span><button class="speak-btn sm" data-speak="${WORDS[i].h}">🔊</button></div>`).join('')}
      </div>
      ${nextBtnHtml}
    </div>`;
  document.getElementById('summaryDone').addEventListener('click', () => {
    if(isLastBatch) exitLesson(); else initBatch(LESSON.batchIndex + 1);
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadState();
  setInterval(tickSessionTimer, 1000);

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.speak-btn');
    if(btn){ e.stopPropagation(); speak(btn.dataset.speak); }
  });

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchScreen(btn.dataset.screen));
  });

  document.getElementById('lessonBackBtn').addEventListener('click', () => {
    if(confirm('Thoát bài học? Tiến độ câu hỏi hiện tại sẽ không được lưu.')) exitLesson();
  });

  document.getElementById('btnVoiceDiag').addEventListener('click', runVoiceDiagnostic);

  document.getElementById('vocabSearch').addEventListener('input', (e) => {
    renderVocabList(e.target.value);
  });

  renderHome();
});
</script>
